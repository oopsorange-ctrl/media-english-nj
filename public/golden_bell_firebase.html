/* ============================ AUDIO ============================ */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, startTime, gainLevel, duration, type){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.linearRampToValueAtTime(gainLevel, startTime + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(startTime); osc.stop(startTime + duration + 0.02);
}
function playTick(){ ensureAudio(); if(!audioCtx) return; playTone(1500, audioCtx.currentTime, 0.12, 0.07, 'square'); }
function playDing(){
  ensureAudio(); if(!audioCtx) return;
  const t = audioCtx.currentTime;
  playTone(880, t, 0.22, 0.22, 'sine');
  playTone(659.25, t + 0.2, 0.22, 0.4, 'sine');
}

/* ============================ FIREBASE HELPERS ============================ */
function fGet(path){ return db.ref(path).once('value').then(s => s.exists() ? s.val() : null); }
function fSet(path, value){ return db.ref(path).set(value); }
function fRemoveListener(ref){ if(ref) ref.off(); }
function sanitizeKey(n){ return String(n).trim().replace(/[^a-zA-Z0-9가-힣]/g,'_').slice(0,40); }
function normalizeAnswer(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,''); }
function genId(){ return 'q_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

async function loadQuestions(tCode){
  const bank = await fGet('banks/' + sanitizeKey(tCode));
  if(bank && Array.isArray(bank) && bank.length > 0) return bank;
  if(bank && typeof bank === 'object'){
    const arr = Object.values(bank);
    if(arr.length > 0) return arr;
  }
  return DEFAULT_QUESTIONS;
}
async function saveBank(tCode, arr){ await fSet('banks/' + sanitizeKey(tCode), arr); }

async function genRoomCode(){
  for(let i=0;i<5;i++){
    const code = String(Math.floor(1000 + Math.random()*9000));
    const exists = await fGet('rooms/' + code + '/state');
    if(!exists) return code;
  }
  return String(Math.floor(1000 + Math.random()*9000));
}

/* ============================ URL PARAM HELPERS ============================ */
function getUrlParam(name){
  try{ return new URLSearchParams(window.location.search).get(name); }catch(e){ return null; }
}
function setUrlParam(name, value){
  try{
    const url = new URL(window.location.href);
    url.searchParams.set(name, value);
    window.history.replaceState(null, '', url.toString());
  }catch(e){}
}

/* ============================ TEACHER CODE ============================ */
function renderTeacherCodeEntry(nextRole){
  app.innerHTML = `
    <div class="center">
      <p class="eyebrow">교사 코드</p>
      <h2 class="title-lg" style="font-size:32px;">본인만의 코드를 정해주세요</h2>
      <p class="sub" style="max-width:360px;">이니셜처럼 짧게 정하면 돼요 (예: NJ). 이 코드로 나만의 문제은행이 따로 저장돼요.</p>
      <input type="text" id="tcInput" placeholder="예: NJ" maxlength="12">
      <div><button class="primary-btn" id="tcBtn">확인</button></div>
      <button class="ghost-btn" id="backBtn">← 처음으로</button>
    </div>`;
  const input = document.getElementById('tcInput');
  const go = () => {
    const val = input.value.trim();
    if(!val) return;
    teacherCode = val;
    setUrlParam('t', teacherCode);
    if(nextRole === 'host') renderHostRoomSetup();
    else renderAdminGate();
  };
  document.getElementById('tcBtn').onclick = go;
  document.getElementById('backBtn').onclick = renderRoleSelect;
  input.addEventListener('keydown', e => { if(e.key==='Enter') go(); });
  input.focus();
}
function resolveTeacherCode(){
  if(teacherCode) return teacherCode;
  const urlT = getUrlParam('t');
  if(urlT){ teacherCode = urlT; return teacherCode; }
  return null;
}
function goHostFlow(){
  const tc = resolveTeacherCode();
  if(tc) renderHostRoomSetup(); else renderTeacherCodeEntry('host');
}
function goAdminFlow(){
  const tc = resolveTeacherCode();
  if(tc) renderAdminGate(); else renderTeacherCodeEntry('admin');
}
function bookmarkHint(){
  return `<div class="bookmark-hint">🔖 이 주소를 즐겨찾기 해두면 다음부터 코드 입력 없이 바로 들어와요:<br>${escapeHtml(window.location.href)}</div>`;
}

/* ============================ STUDENT: REAL-TIME GAME LOOP ============================ */
function startStudentListening(){
  renderStudentWaiting("입장 완료! 곧 시작합니다");
  stateListenerRef = db.ref('rooms/' + currentRoom + '/state');
  stateListenerRef.on('value', snap => {
    const state = snap.exists() ? snap.val() : {phase:'lobby', qIndex:-1};
    onStudentStateChange(state);
  });
}
function onStudentStateChange(state){
  if(state.phase !== 'countdown' && studentLoopHandle){
    clearInterval(studentLoopHandle); studentLoopHandle = null; studentLoopQIndex = null;
  }
  if(state.phase === 'reveal' && lastKnownPhase !== 'reveal'){ playDing(); }
  lastKnownPhase = state.phase;

  if(state.phase === 'lobby'){
    renderStudentWaiting("🎉 " + myName + "님 입장 완료! 곧 시작합니다");
  } else if(state.phase === 'ready'){
    mySubmittedIdx = null; mySubmittedText = null;
    renderStudentQuestion(state, false, null);
  } else if(state.phase === 'countdown'){
    if(studentLoopQIndex !== state.qIndex){
      studentLoopQIndex = state.qIndex;
      runStudentCountdown(state.qIndex, state.countdownEndAt);
    }
  } else if(state.phase === 'reveal'){
    renderStudentQuestion(state, false, null);
  } else if(state.phase === 'final'){
    renderStudentFinal();
  }
}
function renderStudentWaiting(msg){
  app.innerHTML = `
    <div class="center">
      <div class="waiting-icon">⏳</div>
      <p class="sub" style="font-size:17px; color:var(--ivory); font-weight:700;">${escapeHtml(msg)}</p>
      <p class="status-pill">입장 코드 ${escapeHtml(currentRoom)} · 참가자: ${escapeHtml(myName)}</p>
    </div>`;
}

function renderOptionsBlock(q, opts){
  const disabled = opts.disabled;
  const revealMode = opts.reveal;
  if(q.type === 'short'){
    if(revealMode){
      const correct = mySubmittedText !== null && q.accepted.map(normalizeAnswer).includes(normalizeAnswer(mySubmittedText));
      return `<p class="status-pill" style="font-size:14px;">내가 쓴 답: <strong style="color:var(--ivory)">${mySubmittedText ? escapeHtml(mySubmittedText) : '(제출 안 함)'}</strong></p>
        <p class="status-pill">${mySubmittedText===null ? '' : (correct ? '✅ 정답입니다!' : '❌ 아쉬워요')}</p>
        <p class="status-pill">정답 예시: ${escapeHtml(q.accepted.join(', '))}</p>`;
    }
    return `
      <div style="display:flex; gap:10px; max-width:420px;">
        <input type="text" id="shortInput" placeholder="답을 입력하세요" ${disabled?'disabled':''} value="${mySubmittedText?escapeHtml(mySubmittedText):''}">
        <button class="primary-btn" id="shortSubmit" style="margin-top:0;" ${disabled?'disabled':''}>제출</button>
      </div>`;
  }
  let optsHtml = q.options.map((opt,i) => {
    let cls = 'opt-btn';
    if(mySubmittedIdx === i) cls += ' selected';
    if(disabled) cls += ' disabled';
    if(revealMode){
      if(i===q.correct) cls += ' correct-flash';
      else if(mySubmittedIdx===i) cls += ' wrong-flash';
    }
    return `<button class="${cls}" data-i="${i}"><span class="num">${i+1}</span>${escapeHtml(opt)}</button>`;
  }).join('');
  return `<div class="opt-grid ${q.type==='ox'?'ox':''}">${optsHtml}</div>`;
}

function renderStudentQuestion(state, isCountdown, remaining){
  const q = ACTIVE_QUESTIONS[state.qIndex];
  if(!q){ renderStudentWaiting("문제를 불러오는 중..."); return; }
  const disabled = !isCountdown || (q.type==='short' ? mySubmittedText!==null : mySubmittedIdx !== null);

  app.innerHTML = `
    <div class="qpanel" style="max-width:600px;margin:20px auto;">
      <span class="round-tag">${escapeHtml(q.round)}</span>
      <p class="qtext-big">${escapeHtml(q.prompt)}</p>
      ${q.quote ? `<div class="quote-block" style="white-space:pre-line;font-size:14px;">${escapeHtml(q.quote)}</div>` : ''}
      ${isCountdown ? `<div class="timer-wrap"><div class="timer-circle ${remaining<=3?'urgent':''}">${remaining}</div><span class="status-pill">답을 선택하세요</span></div>` : ''}
      ${renderOptionsBlock(q, {disabled, reveal: state.phase==='reveal'})}
      ${!isCountdown && state.phase==='ready' ? `<p class="status-pill" style="margin-top:16px;">선생님이 타이머를 시작하면 답할 수 있어요</p>` : ''}
    </div>`;

  if(q.type === 'short'){
    const btn = document.getElementById('shortSubmit');
    if(btn){
      btn.onclick = async () => {
        const val = document.getElementById('shortInput').value.trim();
        if(!val) return;
        mySubmittedText = val;
        await fSet('rooms/' + currentRoom + '/answers/' + state.qIndex + '/' + sanitizeKey(myName), {name: myName, text: val});
        renderStudentQuestion(state, isCountdown, remaining);
      };
    }
  } else if(isCountdown && mySubmittedIdx===null){
    app.querySelectorAll('.opt-btn').forEach(btn => {
      btn.onclick = async () => {
        const idx = parseInt(btn.dataset.i,10);
        mySubmittedIdx = idx;
        await fSet('rooms/' + currentRoom + '/answers/' + state.qIndex + '/' + sanitizeKey(myName), {name: myName, idx});
        renderStudentQuestion(state, true, remaining);
      };
    });
  }
}

function runStudentCountdown(qIndex, countdownEndAt){
  let lastRemaining = null;
  function tick(){
    const remaining = Math.max(0, Math.ceil((countdownEndAt - Date.now())/1000));
    if(remaining !== lastRemaining){ if(remaining>0) playTick(); lastRemaining = remaining; }
    renderStudentQuestion({phase:'countdown', qIndex}, true, remaining);
    if(remaining <= 0){
      clearInterval(studentLoopHandle); studentLoopHandle = null;
      renderStudentWaiting("채점 중이에요...");
    }
  }
  tick();
  clearInterval(studentLoopHandle);
  studentLoopHandle = setInterval(tick, 250);
}

function renderStudentFinal(){
  app.innerHTML = `
    <div class="center">
      <p class="eyebrow">Game Over</p>
      <h2 class="title-lg" style="font-size:34px;">수고했어요, ${escapeHtml(myName)}!</h2>
      <p class="sub">선생님 화면에서 최종 순위를 확인하세요 🔔</p>
    </div>`;
}

/* ============================ HOST: REAL-TIME ============================ */
let hostStudentsCache = [];

function startHostListening(){
  studentsListenerRef = db.ref('rooms/' + currentRoom + '/students');
  studentsListenerRef.on('value', snap => {
    hostStudentsCache = snap.exists() ? Object.values(snap.val()).sort((a,b)=>a.joinedAt-b.joinedAt) : [];
    const stateNow = app.querySelector('[data-phase]');
    if(stateNow && stateNow.dataset.phase === 'lobby') renderHostLobbyChips();
  });
  stateListenerRef = db.ref('rooms/' + currentRoom + '/state');
  stateListenerRef.on('value', snap => {
    const state = snap.exists() ? snap.val() : {phase:'lobby', qIndex:-1};
    onHostStateChange(state);
  });
}

function onHostStateChange(state){
  if(state.phase === 'lobby') renderHostLobby();
  else if(state.phase === 'ready') renderHostReady(state);
  else if(state.phase === 'countdown') { /* local countdown loop already rendering */ }
  else if(state.phase === 'reveal') renderHostReveal(state);
  else if(state.phase === 'final') renderHostFinal();
}

function renderHostLobby(){
  app.innerHTML = `
    <div class="center" data-phase="lobby">
      <div class="bell-wrap"><div class="bell-ring"></div><div class="bell-ring"></div><div class="bell-ring"></div><div class="bell-icon">🔔</div></div>
      <p class="eyebrow">Challenge Golden Bell · Lesson 2 · 교사 코드 ${escapeHtml(teacherCode)}</p>
      <h1 class="title-lg">BE MEDIA WISE</h1>
      <div class="room-code-card">
        <div class="lbl">입장 코드</div>
        <div class="code">${escapeHtml(currentRoom)}</div>
      </div>
      <p class="sub">학생들이 이 코드와 이름을 태블릿에 입력하면 실시간으로 여기에 나타나요</p>
      <div class="chip-wrap" id="chipWrap"></div>
      <button class="primary-btn" id="startBtn" style="margin-top:30px;">게임 시작 (<span id="studentCount">0</span>명 참가)</button>
      <button class="ghost-btn" id="backBtn">← 처음으로 (다른 수업 코드 만들기)</button>
    </div>`;
  renderHostLobbyChips();
  document.getElementById('startBtn').onclick = async () => {

function renderHostLobbyChips(){
  const wrap = document.getElementById('chipWrap');
  const countEl = document.getElementById('studentCount');
  if(!wrap) return;
  wrap.innerHTML = hostStudentsCache.map(s => `<span class="name-chip">${escapeHtml(s.name)}</span>`).join('') || `<span class="empty-note">아직 참가자가 없어요</span>`;
  if(countEl) countEl.textContent = hostStudentsCache.length;
  const startBtn = document.getElementById('startBtn');
  if(startBtn) startBtn.disabled = hostStudentsCache.length === 0;
}

function questionPanelHtml(q, extra){
  return `
    <div class="qpanel">
      <span class="round-tag">${escapeHtml(q.round)}</span>
      <p class="qtext-big">${escapeHtml(q.prompt)}</p>
      ${q.quote ? `<div class="quote-block" style="white-space:pre-line;">${escapeHtml(q.quote)}</div>` : ''}
      ${extra||''}
    </div>`;
}
function hostOptsPreviewHtml(q){
  if(q.type === 'short') return `<div class="quote-block" style="border-left-color:var(--gold);">✍️ 주관식 문제 — 학생이 직접 답을 입력합니다</div>`;
  return `<div class="opt-grid ${q.type==='ox'?'ox':''}">${q.options.map((opt,i)=>`<div class="opt-btn disabled"><span class="num">${i+1}</span>${escapeHtml(opt)}</div>`).join('')}</div>`;
}

function renderHostReady(state){
  const q = ACTIVE_QUESTIONS[state.qIndex];
  const withSidebar = state.qIndex >= TOP7_FROM_INDEX;
  app.innerHTML = `
    <div data-phase="ready"></div>
    <p class="sub" style="text-align:center;">Q${state.qIndex+1} / ${ACTIVE_QUESTIONS.length} · ${q.points}점 · 코드 ${escapeHtml(currentRoom)}</p>
    <div class="stage-grid ${withSidebar?'with-sidebar':''}">
      <div>
        ${questionPanelHtml(q, `${hostOptsPreviewHtml(q)}
          <div class="footer-controls"><button class="primary-btn" id="startTimerBtn">⏱ 10초 카운트 시작</button></div>`)}
      </div>
      ${withSidebar ? `<div class="sidebar" id="sidebar"></div>` : ''}
    </div>`;
  if(withSidebar) renderSidebar();
  document.getElementById('startTimerBtn').onclick = async () => {
    ensureAudio();
    const countdownEndAt = Date.now() + 10000;
    await fSet('rooms/' + currentRoom + '/state', {phase:'countdown', qIndex: state.qIndex, countdownEndAt, teacherCode});
    runHostCountdown(state.qIndex, countdownEndAt);
  };
}

function runHostCountdown(qIndex, countdownEndAt){
  const q = ACTIVE_QUESTIONS[qIndex];
  const withSidebar = qIndex >= TOP7_FROM_INDEX;
  let lastRemaining = null;

  function tick(){
    const remaining = Math.max(0, Math.ceil((countdownEndAt - Date.now())/1000));
    if(remaining !== lastRemaining){ if(remaining>0) playTick(); lastRemaining = remaining; }
    app.innerHTML = `
      <p class="sub" style="text-align:center;">Q${qIndex+1} / ${ACTIVE_QUESTIONS.length} · ${q.points}점 · 코드 ${escapeHtml(currentRoom)}</p>
      <div class="stage-grid ${withSidebar?'with-sidebar':''}">
        <div>
          ${questionPanelHtml(q, `
            <div class="timer-wrap"><div class="timer-circle ${remaining<=3?'urgent':''}">${remaining}</div><span class="status-pill">학생들이 답을 제출하고 있어요</span></div>
            ${hostOptsPreviewHtml(q)}`)}
        </div>
        ${withSidebar ? `<div class="sidebar" id="sidebar"></div>` : ''}
      </div>`;
    if(withSidebar) renderSidebar();
    if(remaining <= 0){
      clearInterval(countdownTickHandle);
      finishCountdown(qIndex);
    }
  }
  tick();
  clearInterval(countdownTickHandle);
  countdownTickHandle = setInterval(tick, 250);
}

async function finishCountdown(qIndex){
  playDing();
  await fSet('rooms/' + currentRoom + '/state', {phase:'reveal', qIndex, teacherCode});
}

function gradeQuestion(q, val){
  if(q.type === 'short') return q.accepted.map(normalizeAnswer).includes(normalizeAnswer(val.text));
  return val.idx === q.correct;
}

async function renderHostReveal(state){
  const q = ACTIVE_QUESTIONS[state.qIndex];

  if(!scoredQuestions.has(state.qIndex)){
    const answers = await fGet('rooms/' + currentRoom + '/answers/' + state.qIndex) || {};
    for(const key in answers){
      const val = answers[key];
      if(!hostScores.hasOwnProperty(val.name)) hostScores[val.name] = 0;
      if(gradeQuestion(q, val)) hostScores[val.name] += q.points;
    }
    scoredQuestions.add(state.qIndex);
    await fSet('rooms/' + currentRoom + '/scores', hostScores);
  }

  const answers2 = await fGet('rooms/' + currentRoom + '/answers/' + state.qIndex) || {};
  const correctNames = Object.values(answers2).filter(v => gradeQuestion(q, v)).map(v => v.name);

  const withSidebar = state.qIndex >= TOP7_FROM_INDEX;
  let revealBlock;
  if(q.type === 'short'){
    revealBlock = `<div class="quote-block" style="border-left-color:var(--gold);">정답 예시: <strong>${escapeHtml(q.accepted.join(', '))}</strong></div>`;
  } else {
    revealBlock = `<div class="opt-grid ${q.type==='ox'?'ox':''}">${q.options.map((opt,i)=>{
      let cls = 'opt-btn disabled' + (i===q.correct ? ' correct-flash' : '');
      return `<div class="${cls}"><span class="num">${i+1}</span>${escapeHtml(opt)}</div>`;
    }).join('')}</div>`;
  }
  const isLast = state.qIndex === ACTIVE_QUESTIONS.length - 1;

  app.innerHTML = `
    <p class="sub" style="text-align:center;">Q${state.qIndex+1} / ${ACTIVE_QUESTIONS.length} · 정답 공개</p>
    <div class="stage-grid ${withSidebar?'with-sidebar':''}">
      <div>
        ${questionPanelHtml(q, `
          ${revealBlock}
          <div class="answer-list">
            <h4>정답자 (${correctNames.length}명)</h4>
            ${correctNames.length ? correctNames.map(n=>`<span class="correct-name">✓ ${escapeHtml(n)}</span>`).join('') : `<span class="empty-note">이번 문제 정답자가 없어요</span>`}
          </div>
          <div class="footer-controls">
            <button class="primary-btn" id="nextBtn">${isLast ? '🏆 최종 결과 보기' : '다음 문제 →'}</button>
          </div>`)}
      </div>
      ${withSidebar ? `<div class="sidebar" id="sidebar"></div>` : ''}
    </div>`;
  if(withSidebar) renderSidebar();

  document.getElementById('nextBtn').onclick = async () => {
    if(isLast){ await fSet('rooms/' + currentRoom + '/state', {phase:'final', qIndex: state.qIndex, teacherCode}); }
    else { await fSet('rooms/' + currentRoom + '/state', {phase:'ready', qIndex: state.qIndex+1, teacherCode}); }
  };
}

function renderSidebar(){
  const el = document.getElementById('sidebar');
  if(!el) return;
  const ranked = Object.entries(hostScores).sort((a,b)=>b[1]-a[1]).slice(0,7);
  el.innerHTML = `<h3>🏆 TOP 7</h3>` + (ranked.length ?
    ranked.map(([name,score],i)=>`<div class="rank-row"><span class="rank-num">${i+1}</span><span class="rank-name">${escapeHtml(name)}</span><span class="rank-score">${score}점</span></div>`).join('')
    : `<span class="empty-note">아직 점수가 없어요</span>`);
}

function renderHostFinal(){
  const ranked = Object.entries(hostScores).sort((a,b)=>b[1]-a[1]);
  const top3 = ranked.slice(0,3);
  const rest = ranked.slice(3);
  const medals = ['🥇','🥈','🥉'];
  app.innerHTML = `
    <div class="center" style="min-height:auto;padding-top:20px;">
      <p class="eyebrow">Final Result · 코드 ${escapeHtml(currentRoom)}</p>
      <h1 class="title-lg">🎉 최종 순위 🎉</h1>
    </div>
    <div class="podium-row">
      ${top3.map(([name,score],i)=>`
        <div class="podium-card p${i+1}">
          <span class="medal">${medals[i]}</span>
          <p class="podium-name">${escapeHtml(name)}</p>
          <p class="podium-score">${score}점</p>
        </div>`).join('')}
    </div>
    <div class="sidebar" style="max-width:420px;margin:0 auto;">
      <h3>전체 순위</h3>
      ${rest.length ? rest.map(([name,score],i)=>`<div class="rank-row"><span class="rank-num">${i+4}</span><span class="rank-name">${escapeHtml(name)}</span><span class="rank-score">${score}점</span></div>`).join('') : `<span class="empty-note">참가자가 3명 이하예요</span>`}
    </div>
    <div class="center" style="min-height:auto;">
      <button class="ghost-btn" id="backBtn">← 처음으로 (새 수업 시작)</button>
    </div>
  `;
  document.getElementById('backBtn').onclick = renderRoleSelect;
}

/* ============================ ADMIN: 문제 관리 ============================ */
function renderAdminGate(){
  app.innerHTML = `
    <div class="center">
      <p class="eyebrow">문제 관리 · 교사 코드 ${escapeHtml(teacherCode)}</p>
      <h2 class="title-lg" style="font-size:32px;">비밀번호를 입력하세요</h2>
      <input type="password" id="pwInput" maxlength="10">
      <div><button class="primary-btn" id="pwBtn">확인</button></div>
      <button class="ghost-btn" id="backBtn">← 처음으로</button>
      <p class="status-pill" id="pwErr" style="color:#FF8A94;"></p>
    </div>`;
  const input = document.getElementById('pwInput');
  const go = () => {
    if(input.value === ADMIN_PW) renderAdminPanel();
    else document.getElementById('pwErr').textContent = "비밀번호가 틀렸어요";
  };
  document.getElementById('pwBtn').onclick = go;
  document.getElementById('backBtn').onclick = renderRoleSelect;
  input.addEventListener('keydown', e => { if(e.key==='Enter') go(); });
  input.focus();
}

let adminBank = [];

async function renderAdminPanel(){
  adminBank = await loadQuestions(teacherCode);
  drawAdminPanel();
}

function emptyFormState(){
  return { id:null, round:"", type:"mc", points:10, prompt:"", quote:"",
    options:["","","",""], correct:0, correctOx:0, accepted:"" };
}
let adminForm = emptyFormState();

function drawAdminPanel(){
  app.innerHTML = `
    <div class="admin-wrap">
      <div class="admin-topbar">
        <div>
          <p class="eyebrow" style="margin-bottom:4px;">문제 관리 · 교사 코드 ${escapeHtml(teacherCode)}</p>
          <h2 style="font-family:'Black Han Sans',sans-serif; font-size:26px; color:var(--gold-soft);">나만의 문제 은행</h2>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="small-btn" id="resetBtn">기본 20문제 불러오기</button>
          <button class="ghost-btn" id="backBtn">← 처음으로</button>
        </div>
      </div>
      ${bookmarkHint()}

      <div class="admin-card" style="margin-top:18px;">
        <h3>${adminForm.id ? '문제 수정' : '새 문제 추가'}</h3>
        <div class="field-grid2">
          <div class="field-row">
            <label>라운드 이름</label>
            <input type="text" id="f_round" placeholder="예: 01 · 단어 뜻" value="${escapeAttr(adminForm.round)}">
          </div>
          <div class="field-row">
            <label>배점</label>
            <input type="number" id="f_points" value="${adminForm.points}">
          </div>
        </div>
        <div class="field-row">
          <label>문제 유형</label>
          <select id="f_type">
            <option value="mc" ${adminForm.type==='mc'?'selected':''}>4지선다</option>
            <option value="ox" ${adminForm.type==='ox'?'selected':''}>OX 퀴즈</option>
            <option value="short" ${adminForm.type==='short'?'selected':''}>주관식</option>
          </select>
        </div>
        <div class="field-row">
          <label>문제 (발문)</label>
          <textarea id="f_prompt" placeholder="문제 내용을 입력하세요">${escapeHtml(adminForm.prompt)}</textarea>
        </div>
        <div class="field-row">
          <label>참고 문장 / 인용문 (선택)</label>
          <textarea id="f_quote" placeholder="본문 인용 등, 없으면 비워두세요">${escapeHtml(adminForm.quote)}</textarea>
        </div>
        <div id="typeFields"></div>
        <div class="footer-controls" style="justify-content:flex-start;">
          <button class="primary-btn" id="saveQBtn">${adminForm.id ? '수정 저장' : '문제 추가'}</button>
          ${adminForm.id ? `<button class="ghost-btn" id="cancelEditBtn">취소</button>` : ''}
        </div>
      </div>

      <div class="admin-card">
        <h3>현재 문제 목록 (${adminBank.length}문항)</h3>
        <div id="qList"></div>
      </div>
    </div>`;

  drawTypeFields();
  drawQList();

  document.getElementById('backBtn').onclick = renderRoleSelect;
  document.getElementById('resetBtn').onclick = async () => {
    if(!confirm('기본 20문제로 초기화할까요? 현재 목록은 사라져요.')) return;
    adminBank = DEFAULT_QUESTIONS.map(q => ({...q, id: genId()}));
    await saveBank(teacherCode, adminBank);
    drawAdminPanel();
  };
  document.getElementById('f_type').onchange = (e) => { adminForm.type = e.target.value; drawTypeFields(); };
  document.getElementById('saveQBtn').onclick = onSaveQuestion;
  const cancelBtn = document.getElementById('cancelEditBtn');
  if(cancelBtn) cancelBtn.onclick = () => { adminForm = emptyFormState(); drawAdminPanel(); };
}

function drawTypeFields(){
  const el = document.getElementById('typeFields');
  if(adminForm.type === 'mc'){
    el.innerHTML = `
      <div class="field-row"><label>보기 (정답에 라디오 표시)</label>
        ${[0,1,2,3].map(i => `
          <div class="opt-edit-row">
            <input type="radio" name="mcCorrect" value="${i}" ${adminForm.correct===i?'checked':''}>
            <input type="text" id="f_opt${i}" placeholder="보기 ${i+1}" value="${escapeAttr(adminForm.options[i]||'')}">
          </div>`).join('')}
      </div>`;
  } else if(adminForm.type === 'ox'){
    el.innerHTML = `
      <div class="field-row"><label>정답</label>
        <div class="opt-edit-row"><input type="radio" name="oxCorrect" value="0" ${adminForm.correctOx===0?'checked':''}> <span>O</span></div>
        <div class="opt-edit-row"><input type="radio" name="oxCorrect" value="1" ${adminForm.correctOx===1?'checked':''}> <span>X</span></div>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="field-row">
        <label>정답으로 인정할 답 (쉼표로 구분, 대소문자·띄어쓰기 무관)</label>
        <input type="text" id="f_accepted" placeholder="예: 바이킹, bye king" value="${escapeAttr(adminForm.accepted)}">
      </div>`;
  }
}

function readFormFromDom(){
  adminForm.round = document.getElementById('f_round').value.trim() || "새 라운드";
  adminForm.points = parseInt(document.getElementById('f_points').value,10) || 0;
  adminForm.prompt = document.getElementById('f_prompt').value.trim();
  adminForm.quote = document.getElementById('f_quote').value.trim();
  if(adminForm.type === 'mc'){
    adminForm.options = [0,1,2,3].map(i => document.getElementById('f_opt'+i).value.trim());
    const checked = document.querySelector('input[name=mcCorrect]:checked');
    adminForm.correct = checked ? parseInt(checked.value,10) : 0;
  } else if(adminForm.type === 'ox'){
    const checked = document.querySelector('input[name=oxCorrect]:checked');
    adminForm.correctOx = checked ? parseInt(checked.value,10) : 0;
  } else {
    adminForm.accepted = document.getElementById('f_accepted').value.trim();
  }
}

async function onSaveQuestion(){
  readFormFromDom();
  if(!adminForm.prompt){ alert('문제 내용을 입력해주세요.'); return; }

  let qObj = { id: adminForm.id || genId(), round: adminForm.round, points: adminForm.points, type: adminForm.type, prompt: adminForm.prompt };
  if(adminForm.quote) qObj.quote = adminForm.quote;

  if(adminForm.type === 'mc'){
    if(adminForm.options.some(o => !o)){ alert('보기 4개를 모두 입력해주세요.'); return; }
    qObj.options = adminForm.options; qObj.correct = adminForm.correct;
  } else if(adminForm.type === 'ox'){
    qObj.options = ["O","X"]; qObj.correct = adminForm.correctOx;
  } else {
    const accepted = adminForm.accepted.split(',').map(s=>s.trim()).filter(Boolean);
    if(accepted.length === 0){ alert('정답으로 인정할 답을 최소 1개 입력해주세요.'); return; }
    qObj.accepted = accepted;
  }

  if(adminForm.id){
    const idx = adminBank.findIndex(q => q.id === adminForm.id);
    if(idx >= 0) adminBank[idx] = qObj;
  } else {
    adminBank.push(qObj);
  }
  await saveBank(teacherCode, adminBank);
  adminForm = emptyFormState();
  drawAdminPanel();
}

function drawQList(){
  const el = document.getElementById('qList');
  if(adminBank.length === 0){ el.innerHTML = `<span class="empty-note">등록된 문제가 없어요. 위에서 추가하거나 기본 20문제를 불러오세요.</span>`; return; }
  el.innerHTML = adminBank.map((q,i) => `
    <div class="qlist-item">
      <span class="type-badge ${q.type}">${q.type==='mc'?'4지선다':q.type==='ox'?'OX':'주관식'}</span>
      <div class="meta">
        <div class="rd">${escapeHtml(q.round)} · ${q.points}점</div>
        <div class="pr">${i+1}. ${escapeHtml(q.prompt)}</div>
      </div>
      <div class="btns">
        <button class="small-btn" data-act="up" data-id="${q.id}">↑</button>
        <button class="small-btn" data-act="down" data-id="${q.id}">↓</button>
        <button class="small-btn" data-act="edit" data-id="${q.id}">수정</button>
        <button class="danger-btn" data-act="del" data-id="${q.id}">삭제</button>
      </div>
    </div>`).join('');

  el.querySelectorAll('button').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      const idx = adminBank.findIndex(q => q.id === id);
      if(idx < 0) return;
      if(act === 'edit'){
        const q = adminBank[idx];
        adminForm = {
          id: q.id, round: q.round, type: q.type, points: q.points, prompt: q.prompt, quote: q.quote || "",
          options: q.type==='mc' ? q.options.slice() : ["","","",""],
          correct: q.type==='mc' ? q.correct : 0,
          correctOx: q.type==='ox' ? q.correct : 0,
          accepted: q.type==='short' ? q.accepted.join(', ') : ""
        };
        drawAdminPanel();
        window.scrollTo({top:0, behavior:'smooth'});
      } else if(act === 'del'){
        if(!confirm('이 문제를 삭제할까요?')) return;
        adminBank.splice(idx,1);
        await saveBank(teacherCode, adminBank);
        drawQList();
        drawAdminPanel();
      } else if(act === 'up' && idx > 0){
        [adminBank[idx-1], adminBank[idx]] = [adminBank[idx], adminBank[idx-1]];
        await saveBank(teacherCode, adminBank);
        drawQList();
      } else if(act === 'down' && idx < adminBank.length-1){
        [adminBank[idx+1], adminBank[idx]] = [adminBank[idx], adminBank[idx+1]];
        await saveBank(teacherCode, adminBank);
        drawQList();
      }
    };
  });
}

/* ============================ UTIL ============================ */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }
</script>
